; ============================================================================
;  PlatformIO Configuration — Nguồn DC đa năng (STM32F103C8T6 Blue Pill)
; ============================================================================
;  Cách dùng: mở THƯ MỤC `firmware/` này bằng VS Code (có cài extension
;  PlatformIO IDE) — PlatformIO sẽ tự:
;    1. Cài platform ststm32 + core Arduino (STM32duino)
;    2. Cài 2 thư viện màn hình theo mục lib_deps bên dưới
;    3. Biên dịch file .ino trong thư mục `nguon_dc_da_nang/` (src_dir)
;  Nạp: bấm nút ➜ (Upload) trên thanh dưới của VS Code, qua ST-Link V2.
; ============================================================================

[platformio]
src_dir = nguon_dc_da_nang

[env:bluepill_f103c8]
platform      = ststm32
board         = bluepill_f103c8
framework     = arduino
upload_protocol = stlink
debug_tool    = stlink
monitor_speed = 115200

; Hai thư viện màn hình — PlatformIO tự tải đúng bản mới khi build lần đầu
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library

; Tối ưu kích thước như cấu hình Arduino IDE (Smallest)
build_flags =
    -Os
